ddeb;border-radius:12px;padding:16px;margin:10px 0;background:#fff}article strong{display:block;font-size:17px}article small{display:block;color:#71647b;margin:6px 0}article button{font-size:13px;background:#f1eaf6;color:#57206d}#editor,#commercial-form{padding:clamp(12px,3vw,24px);border:1px solid #e6ddeb;border-radius:16px;background:#fff}.commercial-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.commercial-menu button{background:#f4eef8;color:#542768;border:1px solid #e3d6ed;text-align:left;min-height:90px;margin:0}.commercial-menu button strong,.commercial-menu button small{display:block}.commercial-menu button small{font-weight:400;margin-top:8px}dialog{border:0;border-radius:18px;max-width:min(720px,92vw);width:100%;max-height:85vh;padding:24px;color:#30263c;box-shadow:0 20px 80px #0004}dialog::backdrop{background:#25113699}#preview-text{white-space:pre-wrap;overflow-wrap:anywhere}#status,#commercial-status{color:#63327c;font-weight:600}#article-count{color:#71647b;font-size:14px}</style><main><header class="studio-header"><a href="/">← Revista pública</a><small>BRUJA TIANGÜERA / ESTUDIO DIGITAL</small><h1>Centro de administración</h1><p>Publicaciones, comunidad y gestión comercial</p></header><p id="status" role="status"></p><form id="login"><label>Usuario<input name="user" autocomplete="username" required></label><label for="login-password">Contraseña</label><div class="password-wrap"><input id="login-password" name="password" type="password" autocomplete="current-password" required><button type="button" id="toggle-password" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path id="eye-slash" d="M3 3l18 18" style="display:none"/></svg></button></div><button>Entrar</button></form><section id="panel" hidden><button id="logout">Cerrar sesión</button><nav><button id="open-editorial">Publicar reportajes</button><button id="open-commercial" hidden>Gestionar anunciantes</button></nav><div id="editorial-area"><nav class="subnav"><button id="library-tab" type="button">Biblioteca editorial</button><button id="create-tab" type="button">+ Nuevo reportaje</button></nav><section id="editor-screen" hidden><h2>Editor de reportajes</h2><form id="editor"><input name="id" type="hidden"><label>Sección<select name="section"></select></label><label>Corresponsal<select name="correspondent"></select></label><label>Título<input name="title" required maxlength="220"></label><label>Resumen<textarea name="summary" required maxlength="1000"></textarea></label><label>Reportaje<textarea name="body" rows="10" required maxlength="30000"></textarea></label><label>Imagen de portada (JPG o PNG, máximo 2 MB)<input name="image_upload" type="file" accept="image/jpeg,image/png"></label><label>O imagen externa (URL HTTPS opcional)<input name="image" type="url"></label><label>Contenido multimedia adicional (YouTube, imagen u otro enlace HTTPS)<input name="media_url" type="url" placeholder="https://..."></label><button>Publicar</button><button type="button" id="clear">Nuevo</button></form></section><section id="library-screen"><h2>Biblioteca editorial</h2><label>Buscar por título o texto<input id="article-search" type="search" placeholder="Buscar reportajes…"></label><div id="section-tabs" class="section-tabs"></div><label>Estado<select id="article-state"><option value="all">Todos los estados</option><option value="active">Publicados</option><option value="archived">Archivados</option></select></label><p id="article-count"></p><div id="articles"></div></section><dialog id="article-preview"><button id="close-preview" type="button">Cerrar vista previa</button><div id="preview-text"></div></dialog></div><section id="commercial" hidden><h2>Gestión comercial</h2><p id="commercial-status" role="status"></p><div id="commercial-menu" class="commercial-menu"></div><div id="commercial-workspace" hidden><button id="commercial-back" type="button">← Todas las áreas</button><h3 id="commercial-heading"></h3><form id="commercial-form"><input name="id" type="hidden"><label>Sección<select name="kind"><option value="colores">Colores</option><option value="cupones">Cupones</option><option value="negocios">Conoce este negocio</option><option value="entrevistas">Nuestra Gente</option><option value="sponsors">Patrocinadores principales</option><option value="anunciate">Anunciantes y contratos</option></select></label><label>Nombre<input name="name" required></label><label>Categoría o actividad<input name="category"></label><label>Formato<select name="tier"><option value="general">General $50</option><option value="especial">Especializado $80</option><option value="estandar">Cupón estándar $100</option><option value="destacado">Cupón destacado $180</option><option value="principal">Patrocinador principal $600</option></select></label><label>Título<input name="title"></label><label>Descripción, dirección o artículo<textarea name="description" rows="6"></textarea></label><label>WhatsApp (10 dígitos)<input name="phone" inputmode="tel"></label><label>Facebook<input name="facebook" type="url"></label><label>Instagram<input name="instagram" type="url"></label><label>TikTok, YouTube u otra red<input name="social" type="url"></label><label>Video<input name="video" type="url"></label><label>Imagen JPG/PNG<input name="image_upload" type="file" accept="image/jpeg,image/png"></label><label>URL de imagen<input name="image" type="url"></label><label>Destino del logo: URL o WhatsApp<input name="destination"></label><button>Guardar</button><button type="button" id="commercial-new">Nuevo</button></form><div id="commercial-list"></div></div></section></section></main><script src="/administracion/panel.js?v=20261127studio" defer></script><script src="/administracion/comercial.js?v=2" defer></script><script>const pw=document.getElementById("login-password"),toggle=document.getElementById("toggle-password");toggle.addEventListener("click",()=>{const show=pw.type==="password";pw.type=show?"text":"password";toggle.setAttribute("aria-pressed",String(show));toggle.setAttribute("aria-label",show?"Ocultar contraseña":"Mostrar contraseña");toggle.title=show?"Ocultar contraseña":"Mostrar contraseña";document.getElementById("eye-slash").style.display=show?"":"none";});</script></html>
