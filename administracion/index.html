<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Bruja Tiangüera</title><style>body{font:16px system-ui;background:#f8f4f8;color:#302035;max-width:680px;margin:auto;padding:24px}main{background:white;padding:24px;border-radius:18px}label,input,textarea,select{display:block;width:100%;box-sizing:border-box;margin:8px 0}input,textarea,select,button{font:inherit;padding:10px}button{background:#57206d;color:white;border:0;border-radius:8px;margin:8px 4px 8px 0}article{border-top:1px solid #ddd;padding:12px 0}a{color:#57206d}.password-wrap{position:relative}.password-wrap input{padding-right:54px}.password-wrap button{position:absolute;right:4px;top:50%;transform:translateY(-50%);margin:0;background:transparent;color:#57206d;width:44px;height:44px;display:grid;place-items:center;padding:8px}.password-wrap button:focus-visible{outline:2px solid #57206d}</style><main><a href="/">← Revista</a><h1>Administración editorial</h1><p id="status" role="status"></p><form id="login"><label>Usuario<input name="user" autocomplete="username" required></label><label for="login-password">Contraseña</label><div class="password-wrap"><input id="login-password" name="password" type="password" autocomplete="current-password" required><button type="button" id="toggle-password" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path id="eye-slash" d="M3 3l18 18" style="display:none"/></svg></button></div><button>Entrar</button></form><section id="panel" hidden><button id="logout">Cerrar sesión</button><h2>Mis reportajes</h2><form id="editor"><input name="id" type="hidden"><label>Sección<select name="section"></select></label><label>Corresponsal<select name="correspondent"></select></label><label>Título<input name="title" required maxlength="220"></label><label>Resumen<textarea name="summary" required maxlength="1000"></textarea></label><label>Reportaje<textarea name="body" rows="10" required maxlength="30000"></textarea></label><label>Imagen (URL HTTPS opcional)<input name="image" type="url"></label><button>Publicar</button><button type="button" id="clear">Nuevo</button></form><div id="articles"></div></section></main><script src="/administracion/panel.js" defer></script><script>const pw=document.getElementById("login-password"),toggle=document.getElementById("toggle-password");toggle.addEventListener("click",()=>{const show=pw.type==="password";pw.type=show?"text":"password";toggle.setAttribute("aria-pressed",String(show));toggle.setAttribute("aria-label",show?"Ocultar contraseña":"Mostrar contraseña");toggle.title=show?"Ocultar contraseña":"Mostrar contraseña";document.getElementById("eye-slash").style.display=show?"":"none";});</script></html>
