<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Bruja Tiangüera</title><style>body{font:16px system-ui;background:#f8f4f8;color:#302035;max-width:680px;margin:auto;padding:24px}main{background:white;padding:24px;border-radius:18px}label,input,textarea,select{display:block;width:100%;box-sizing:border-box;margin:8px 0}input,textarea,select,button{font:inherit;padding:10px}button{background:#57206d;color:white;border:0;border-radius:8px;margin:8px 4px 8px 0}article{border-top:1px solid #ddd;padding:12px 0}a{color:#57206d}</style><main><a href="/">← Revista</a><h1>Administración editorial</h1><p id="status" role="status"></p><form id="login"><label>Usuario<input name="user" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><section id="panel" hidden><button id="logout">Cerrar sesión</button><h2>Mis reportajes</h2><form id="editor"><input name="id" type="hidden"><label>Sección<select name="section"></select></label><label>Corresponsal<select name="correspondent"></select></label><label>Título<input name="title" required maxlength="220"></label><label>Resumen<textarea name="summary" required maxlength="1000"></textarea></label><label>Reportaje<textarea name="body" rows="10" required maxlength="30000"></textarea></label><label>Imagen (URL HTTPS opcional)<input name="image" type="url"></label><button>Publicar</button><button type="button" id="clear">Nuevo</button></form><div id="articles"></div></section></main><script src="/administracion/panel.js" defer></script></html>
