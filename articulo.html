<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#451056"><link rel="stylesheet" href="/assets/style.css"><title>Reportaje · Revista Bruja Tiangüera</title><meta name="description" content="Reportajes originales de Revista Bruja Tiangüera."><style>.editorial-article{max-width:790px;margin:0 auto;padding:20px 18px 50px}.editorial-article h1{font:700 clamp(28px,5vw,44px) Georgia,serif;line-height:1.2;color:#481258}.editorial-article p{font-size:1.1rem;line-height:1.8}.editorial-article .cover{display:block;width:100%;max-width:360px;height:auto;max-height:220px;object-fit:contain;object-position:left center;border-radius:12px;margin:16px 0 20px}@media(max-width:600px){.editorial-article .cover{max-width:min(100%,280px);max-height:190px}}.editorial-article .lead{font-size:1.25rem;color:#684b72}.editorial-article .byline{font-size:.9rem;color:#75627c}.editorial-article .sources{border-top:1px solid #e4d4e9;margin-top:35px;padding-top:16px}.editorial-article .sources a{color:#6c167e;text-decoration:underline;overflow-wrap:anywhere}.editorial-article .sources li{margin:9px 0}</style></head><body><main class="editorial-article"><p><a href="/" id="back">← Revista Bruja Tiangüera</a></p><article id="article"><p>Cargando reportaje…</p></article><footer class="footer">Revista Bruja Tiangüera · Reportajes originales · Las Choapas, Veracruz</footer></main><script>
(async()=>{const root=document.getElementById('article');try{const r=await fetch('/data/config.json',{cache:'no-store'});if(!r.ok)throw Error('No disponible');const cfg=await r.json();const id=new URLSearchParams(location.search).get('id');const a=(cfg.editorial_articles||[]).find(x=>x.id===id&&x.published!==false);if(!a)throw Error('Artículo no encontrado');document.title=a.title+' · Revista Bruja Tiangüera';root.replaceChildren();const small=document.createElement('small');small.textContent='REPORTAJE · '+(a.section||'').toUpperCase();const h=document.createElement('h1');h.textContent=a.title;const lead=document.createElement('p');lead.className='lead';lead.textContent=a.summary||'';const by=document.createElement('p');by.className='byline';by.textContent=(a.author||'Redacción')+' · '+(a.date||'');root.append(small);if(a.image&&/^(https:\/\/|\/assets\/)/i.test(a.image)){const img=document.createElement('img');img.src=a.image;img.alt='Portada del reportaje: '+a.title;img.className='cover';img.loading='eager';root.append(img);if(a.image_caption){const caption=document.createElement('p');caption.className='byline';caption.textContent=a.image_caption;root.append(caption)}}if(a.video_youtube_id&&/^[A-Za-z0-9_-]{11}$/.test(a.video_youtube_id)){const section=document.createElement('section');section.className='article-video';const heading=document.createElement('h2');heading.textContent=a.video_heading||'Video del reportaje';const frame=document.createElement('iframe');frame.src='https://www.youtube-nocookie.com/embed/'+a.video_youtube_id;frame.title=a.video_caption||'Video del reportaje';frame.loading='lazy';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';frame.style.cssText='display:block;width:100%;max-width:620px;aspect-ratio:16/9;border:0;border-radius:12px';const caption=document.createElement('p');caption.className='byline';caption.textContent=a.video_caption||'';const link=document.createElement('a');link.href='https://www.youtube.com/watch?v='+a.video_youtube_id;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Ver introducción en YouTube';section.append(heading,frame,caption,link);root.append(section)}root.append(h,lead,by);for(const paragraph of a.body||[]){const p=document.createElement('p');p.textContent=paragraph;root.append(p)}if(a.sources?.length){const div=document.createElement('section');div.className='sources';const h2=document.createElement('h2');h2.textContent='Fuentes y referencias';const ul=document.createElement('ul');for(const [label,url] of a.sources){const li=document.createElement('li'),link=document.createElement('a');link.href=url;link.textContent=label;link.target='_blank';link.rel='noopener noreferrer';li.append(link);ul.append(li)}div.append(h2,ul);root.append(div)}}catch(e){root.textContent='No se pudo cargar este reportaje. Regresa a la portada y vuelve a intentarlo.'}})();
</script></body></html>
