<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#451056"><link rel="stylesheet" href="/assets/style.css"><title>Reportaje · Revista Bruja Tiangüera</title><meta name="description" content="Reportajes originales de Revista Bruja Tiangüera."><style>.editorial-article{max-width:790px;margin:0 auto;padding:20px 18px 50px}.editorial-article h1{font:700 clamp(28px,5vw,44px) Georgia,serif;line-height:1.2;color:#481258}.editorial-article p{font-size:1.1rem;line-height:1.8}.editorial-article .cover{display:block;width:100%;max-width:360px;height:auto;max-height:220px;object-fit:contain;object-position:left center;border-radius:12px;margin:16px 0 20px}@media(max-width:600px){.editorial-article .cover{max-width:min(100%,280px);max-height:190px}}.editorial-article .lead{font-size:1.25rem;color:#684b72}.editorial-article .byline{font-size:.9rem;color:#75627c}.editorial-article .sources{border-top:1px solid #e4d4e9;margin-top:35px;padding-top:16px}.editorial-article .sources a{color:#6c167e;text-decoration:underline;overflow-wrap:anywhere}.editorial-article .sources li{margin:9px 0}.game-review{display:grid;grid-template-columns:minmax(0,1fr) minmax(85px,30%);gap:16px;align-items:start;border-top:1px solid #e4d4e9;padding:18px 0}.game-review h2{font-size:1.35rem;margin:0 0 8px}.game-review p{margin:6px 0}.game-review figure{margin:0}.game-review img{width:100%;max-height:180px;object-fit:contain}.game-review figcaption{font-size:.72rem;color:#75627c;overflow-wrap:anywhere}.game-review a{color:#6c167e;text-decoration:underline}</style></head><body><main class="editorial-article"><p><a href="/" id="back">← Revista Bruja Tiangüera</a></p><article id="article"><p>Cargando reportaje…</p></article><footer class="footer">Revista Bruja Tiangüera · Reportajes originales · Las Choapas, Veracruz</footer></main><script>
(async()=>{const root=document.getElementById('article');try{const r=await fetch('/data/config.json',{cache:'no-store'});if(!r.ok)throw Error('No disponible');const cfg=await r.json();const id=new URLSearchParams(location.search).get('id');const a=(cfg.editorial_articles||[]).find(x=>x.id===id&&x.published!==false);if(!a)throw Error('Artículo no encontrado');document.title=a.title+' · Revista Bruja Tiangüera';root.replaceChildren();const small=document.createElement('small');small.textContent='REPORTAJE · '+(a.section||'').toUpperCase();const h=document.createElement('h1');h.textContent=a.title;const lead=document.createElement('p');lead.className='lead';lead.textContent=a.summary||'';const by=document.createElement('p');by.className='byline';const correspondent=cfg.editorial_correspondents?.[a.correspondent];by.textContent=(correspondent?'Reportaje aportado por '+correspondent.name+' · Corresponsal':a.author||'Redacción Bruja Tiangüera')+' · '+(a.date||'');if(a.image&&/^(https:\/\/|\/assets\/)/i.test(a.image)){const img=document.createElement('img');img.src=a.image;img.alt='Portada del reportaje: '+a.title;img.className='cover';img.loading='eager';root.append(img);if(a.image_caption){const caption=document.createElement('p');caption.className='byline';caption.textContent=a.image_caption;root.append(caption)}}root.append(h,by,lead);if(a.video_youtube_id&&/^[A-Za-z0-9_-]{11}$/.test(a.video_youtube_id)){const section=document.createElement('section');section.className='article-video';const heading=document.createElement('h2');heading.textContent=a.video_heading||'Video del reportaje';const frame=document.createElement('iframe');frame.src='https://www.youtube-nocookie.com/embed/'+a.video_youtube_id;frame.title=a.video_caption||'Video del reportaje';frame.loading='lazy';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';frame.style.cssText='display:block;width:100%;max-width:620px;aspect-ratio:16/9;border:0;border-radius:12px';const caption=document.createElement('p');caption.className='byline';caption.textContent=a.video_caption||'';const link=document.createElement('a');link.href='https://www.youtube.com/watch?v='+a.video_youtube_id;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Ver introducción en YouTube';section.append(heading,frame,caption,link);root.append(section)}for(const paragraph of a.body||[]){const p=document.createElement('p');p.textContent=paragraph;root.append(p)}if(a.media_url){try{const u=new URL(a.media_url);if(u.protocol==="https:"){const section=document.createElement("section"),heading=document.createElement("h2");heading.textContent="Contenido relacionado";section.append(heading);let vid="";if(u.hostname==="youtu.be")vid=u.pathname.slice(1);else if(["youtube.com","www.youtube.com","m.youtube.com"].includes(u.hostname))vid=u.searchParams.get("v")||u.pathname.match(/^\/(shorts|embed)\/([^/]+)/)?.[2]||"";if(/^[A-Za-z0-9_-]{11}$/.test(vid)){const f=document.createElement("iframe");f.src="https://www.youtube-nocookie.com/embed/"+vid;f.title="Video relacionado";f.loading="lazy";f.allowFullscreen=true;f.style.cssText="width:100%;aspect-ratio:16/9;border:0";section.append(f)}else if(/\.(jpg|jpeg|png|webp)$/i.test(u.pathname)){const img=document.createElement("img");img.src=u.href;img.alt="Imagen relacionada";img.loading="lazy";img.style.maxWidth="100%";section.append(img)}const link=document.createElement("a");link.href=u.href;link.target="_blank";link.rel="noopener noreferrer";link.textContent="Abrir contenido relacionado";section.append(link);root.append(section)}}catch{}}for(const g of a.game_reviews||[]){if(g.extra){const heading=document.createElement('h2');heading.textContent='El pilón: cuando los niños se van a dormir (18+)';root.append(heading)}const item=document.createElement('section');item.className='game-review';const info=document.createElement('div'),title=document.createElement('h2');title.textContent=g.title;const desc=document.createElement('p');desc.textContent=g.description;const details=document.createElement('p');details.className='byline';details.textContent=g.details;const link=document.createElement('a');link.href=g.shop;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Consultar tienda y disponibilidad';info.append(title,desc,details,link);const ml=document.createElement('a');ml.href='https://listado.mercadolibre.com.mx/'+encodeURIComponent(g.search||g.title);ml.target='_blank';ml.rel='noopener noreferrer';ml.textContent='Buscar en Mercado Libre';const p=document.createElement('p');p.append(ml);info.append(p);item.append(info);if(g.image&&g.image.startsWith('https://')){const fig=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');img.src=g.image;img.alt='Caja de '+g.title;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{img.hidden=true};cap.textContent=g.credit||'Imagen comercial de referencia';fig.append(img,cap);item.append(fig)}root.append(item)}if(a.game_reviews?.length){const p=document.createElement('p');p.className='byline';p.textContent='Selección editorial, no clasificación de ventas. Precios orientativos en MXN al 26 de noviembre de 2026; confirmar edición, idioma, existencias y envío. Imágenes de catálogo enlazadas a sus fuentes comerciales; marcas de sus respectivos titulares.';root.append(p)}if(a.sources?.length){const div=document.createElement('section');div.className='sources';const h2=document.createElement('h2');h2.textContent='Fuentes y referencias';const ul=document.createElement('ul');for(const [label,url] of a.sources){const li=document.createElement('li'),link=document.createElement('a');link.href=url;link.textContent=label;link.target='_blank';link.rel='noopener noreferrer';li.append(link);ul.append(li)}div.append(h2,ul);root.append(div)}if(correspondent&&(correspondent.url||correspondent.whatsapp)){const p=document.createElement('p');p.className='byline';const link=document.createElement('a');link.href=a.correspondent==='partera'?correspondent.whatsapp:(correspondent.url||correspondent.whatsapp);link.textContent=a.correspondent==='partera'?'Si deseas agendar una cita con Partera Annie Arenas, haz clic aquí.':'Contacto: '+correspondent.name;link.target='_blank';link.rel='noopener noreferrer';p.append(link);root.append(p)}}catch(e){root.textContent='No se pudo cargar este reportaje. Regresa a la portada y vuelve a intentarlo.'}})();
</script></body></html>
